name: Verify and release 慢慢赚钱

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run schedule tests
        run: python -m unittest discover -s tests -v

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install packager
        run: python -m pip install -r requirements-dev.txt
      - name: Build Windows app
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name manmanzhuanqian manmanzhuanqian.py
      - name: Create ZIP download
        run: Compress-Archive -Path dist\manmanzhuanqian.exe -DestinationPath "dist\manmanzhuanqian-${{ github.ref_name }}-windows-x64.zip"
      - name: Create SHA-256 checksum
        run: (Get-FileHash dist\manmanzhuanqian.exe -Algorithm SHA256).Hash.ToLower() + "  manmanzhuanqian.exe" | Set-Content -Encoding ascii dist\SHA256SUMS.txt
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/manmanzhuanqian.exe
            dist/manmanzhuanqian-${{ github.ref_name }}-windows-x64.zip
            dist/SHA256SUMS.txt
